[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scentience-olfaction"
version = "0.1.0"
description = "Chemical plume transport and olfactory sensor models for NVIDIA Isaac Sim and Isaac Lab"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Scentience AND LicenseRef-Scentience-Sensor-Research"
license-files = ["LICENSE", "scentience_olfaction/sensors/LICENSE_MODEL", "NOTICE", "ACKNOWLEDGEMENTS"]
authors = [{ name = "Scentience, Inc." }]
keywords = ["robotics", "olfaction", "isaac-sim", "isaac-lab", "plume", "electronic-nose"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
# Core stays importable with NO Isaac and NO GPU. That is a hard requirement:
# it is what lets the physics run in CI and lets non-Isaac users adopt it.
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/Scentience/scentience-isaacsim"
Repository = "https://github.com/Scentience/scentience-isaacsim"
Issues = "https://github.com/Scentience/scentience-isaacsim/issues"

[project.optional-dependencies]
gpu = ["warp-lang>=1.5"]
torch = ["torch>=2.0"]
envs = ["gymnasium>=0.29"]
yaml = ["pyyaml"]
viz = ["matplotlib>=3.7"]
bridge = ["scentience>=2.2.2,<3"]
train = ["stable-baselines3>=2.3,<3", "gymnasium>=0.29"]
test = ["pytest>=7", "pytest-cov", "ruff>=0.9,<1", "build>=1", "scipy", "gymnasium>=0.29", "matplotlib>=3.7"]
dev = ["scentience-olfaction[test,gpu,torch,train,bridge]"]

[tool.setuptools.packages.find]
include = ["scentience_olfaction*", "scentience_isaaclab*"]

[tool.setuptools.package-data]
scentience_olfaction = ["py.typed", "sensors/LICENSE_MODEL"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["_to_delete"]

# Pinned explicitly. Ruff's implicit default rule set has widened across
# releases, so relying on it means `ruff check .` in CI can go red on a ruff
# upgrade with no change to this repo -- which is what had happened.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
  # Standalone-runnable files intentionally open with
  #   import sys, os; sys.path.insert(0, ...)
  # so `python tests/foo.py` and `python examples/foo.py` work without an
  # install. That idiom trips all three of these.
  "E401",  # multiple imports on one line
  "E402",  # module import not at top of file
  "E702",  # multiple statements on one line (semicolon)
]

[tool.ruff.lint.per-file-ignores]
# Kit extensions re-export their public surface via star-import by convention.
"isaac_extension/**/__init__.py" = ["F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["isaac: requires a running Isaac Sim installation", "slow: long records"]
