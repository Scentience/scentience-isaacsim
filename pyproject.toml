[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scentience-olfaction"
version = "0.1.0.dev0"
description = "Chemical plume transport and olfactory sensor models for NVIDIA Isaac Sim and Isaac Lab"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Scentience, Inc." }]
keywords = ["robotics", "olfaction", "isaac-sim", "isaac-lab", "plume", "electronic-nose"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core stays importable with NO Isaac and NO GPU. That is a hard requirement:
# it is what lets the physics run in CI and lets non-Isaac users adopt it.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gpu = ["warp-lang>=1.5"]
torch = ["torch>=2.0"]
dev = ["pytest>=7", "pytest-cov", "ruff", "warp-lang>=1.5", "torch>=2.0", "scipy"]

[tool.setuptools.packages.find]
include = ["scentience_olfaction*", "scentience_isaaclab*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["isaac: requires a running Isaac Sim installation", "slow: long records"]
